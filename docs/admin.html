<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World of Chance Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main>
  <form id="login" class="card login" hidden>
    <h2>Admin</h2>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button class="primary" type="submit">Log in</button>
    <p class="muted" id="loginmsg"></p>
  </form>

  <div id="panel" hidden>
    <div class="top">
      <div><div class="muted">Now playing</div><div class="modes" id="modes"></div></div>
    </div>

    <div class="admin-grid">
      <div class="card">
        <div class="muted">Participants</div>
        <div class="big" id="count">0</div>
        <div class="muted" id="joinstate" style="margin-bottom:10px"></div>
        <div class="row">
          <button id="lock">Lock joining</button>
          <button id="clearall" class="danger">Clear all participants</button>
        </div>
      </div>
      <div class="card">
        <div class="muted">Join link</div>
        <div class="link" id="link"></div>
        <div class="muted" id="linkhint" style="font-size:13px"></div>
        <div id="qr"></div>
      </div>
    </div>

    <!-- welcome -->
    <section id="admin-welcome" hidden>
      <div class="card">
        <h3 style="margin-bottom:10px">Participants see the welcome screen with their ID</h3>
        <div class="chips" id="welcome-ids"></div>
      </div>
    </section>

    <!-- generations -->
    <section id="admin-generations" hidden>
      <div class="top">
        <h1 id="gen">Generation 1</h1>
        <div class="row">
          <button id="reset" class="danger">New round</button>
          <button id="next" class="primary">Next generation →</button>
        </div>
      </div>
      <div class="admin-grid">
        <div class="card">
          <div class="muted">In this round</div>
          <div class="big" id="ginround">0</div>
          <div class="kv" style="margin-top:10px">
            <span class="muted">Mean match (all pairs)</span><b id="gmean">–</b>
            <span class="muted">Related pairs</span><b id="grel">–</b>
            <span class="muted">Best pair</span><b id="gbest">–</b>
            <span class="muted">Worst pair</span><b id="gworst">–</b>
          </div>
        </div>
        <div class="card"><h3>Over the generations</h3><div class="chartwrap"><canvas id="trend"></canvas></div></div>
      </div>
      <div class="admin-grid">
        <div class="card"><h3>Pairwise matches this generation</h3><div class="chartwrap"><canvas id="hist"></canvas></div></div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:10px">All participants</h3>
        <div class="people" id="people"></div>
      </div>
    </section>
  </div>
</main>
<div class="status" id="status"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin/welcome.js"></script>
<script src="js/admin/generations.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
